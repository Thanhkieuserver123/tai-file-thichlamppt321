<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Nguyên & Slide Sáng Tạo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- Hiệu ứng nền kính mờ -->
    <div class="absolute top-10 left-10 w-96 h-96 bg-teal-500/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute top-1/3 right-10 w-96 h-96 bg-indigo-500/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header -->
    <header class="py-8 px-6 text-center border-b border-white/10 bg-slate-900/30 backdrop-blur-2xl relative z-10">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight bg-gradient-to-r from-teal-400 to-indigo-400 bg-clip-text text-transparent">
            TẢI FILE THICHLAMPPT321
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">Cảm ơn bạn đã quan tâm đến kênh Thichlampp321.</p>
        
        <!-- Bộ lọc danh mục -->
        <div class="flex justify-center gap-3 mt-6 flex-wrap">
            <button onclick="filterCards('all')" class="px-4 py-2 rounded-full text-sm font-medium bg-teal-500/80 backdrop-blur-md text-slate-950 transition hover:bg-teal-400 shadow-lg">Tất cả</button>
            <button onclick="filterCards('slide')" class="px-4 py-2 rounded-full text-sm font-medium bg-white/5 border border-white/10 backdrop-blur-md text-slate-300 transition hover:bg-white/10">Slide Thuyết Trình</button>
            <button onclick="filterCards('game')" class="px-4 py-2 rounded-full text-sm font-medium bg-white/5 border border-white/10 backdrop-blur-md text-slate-300 transition hover:bg-white/10">Trò Chơi</button>
        </div>
    </header>

    <!-- Main Content: Lưới hiển thị tự động từ JSON -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cardGrid">
            <!-- Dữ liệu sẽ được chèn tự động bằng JavaScript ở đây -->
        </div>
    </main>

    <!-- Modal Popup Chi tiết -->
    <div id="fileModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900/60 backdrop-blur-3xl border border-white/20 w-full max-w-xl rounded-3xl p-6 md:p-8 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center transition">×</button>
            
            <div class="text-center">
                <p id="modalNote" class="text-xs text-amber-400 mb-2 font-medium"></p>
                <h2 id="modalTitle" class="text-2xl font-bold text-white mb-2"></h2>
                <p class="text-xs text-slate-400 mb-6">@Thichlamppt321</p>

                <div class="flex justify-center gap-4 mb-6 text-slate-300">
                    <span class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs backdrop-blur-md">TikTok</span>
                    <span class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs backdrop-blur-md">Facebook</span>
                </div>

                <a id="modalDownloadBtn" href="#" target="_blank" class="block w-full py-3 px-6 rounded-xl border border-white/20 bg-white/10 font-semibold text-white hover:bg-teal-500 hover:border-teal-500 hover:text-slate-950 transition duration-300 text-center backdrop-blur-md shadow-lg">
                    TẢI XUỐNG
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-white/10 bg-slate-900/20 backdrop-blur-md relative z-10">
        © 2026 Thichlamppt321
    </footer>

    <!-- Script tự động nạp dữ liệu từ data.json -->
    <script>
        let allFiles = [];

        // Tải dữ liệu từ file data.json tự động
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                allFiles = data;
                renderCards(allFiles);
            })
            .catch(error => console.error('Lỗi tải dữ liệu:', error));

        function renderCards(files) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            
            files.forEach(file => {
                let categoryName = file.category === 'slide' ? 'Slide' : 'Trò Chơi';
                let categoryColor = file.category === 'slide' ? 'text-teal-400' : 'text-indigo-400';
                
                grid.innerHTML += `
                    <div data-category="${file.category}" class="group relative bg-slate-900/40 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden shadow-2xl hover:border-teal-500/50 transition duration-300 cursor-pointer" onclick="openModal('${file.title.replace(/'/g, "\\'")}', '${file.note.replace(/'/g, "\\'")}', '${file.link}')">
                        <div class="h-48 overflow-hidden relative">
                            <img src="${file.img}" alt="${file.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent opacity-80"></div>
                        </div>
                        <div class="p-5">
                            <span class="text-xs font-semibold ${categoryColor} uppercase tracking-wider">${categoryName}</span>
                            <h3 class="text-lg font-bold mt-1 text-slate-100 group-hover:text-teal-300 transition">${file.title}</h3>
                            <p class="text-slate-400 text-xs mt-2">@Thichlamppt321</p>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(title, note, downloadLink) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalNote').innerText = "(*) LƯU Ý QUAN TRỌNG: " + note;
            document.getElementById('modalDownloadBtn').href = downloadLink;
            document.getElementById('fileModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('fileModal').classList.add('hidden');
        }

        window.onclick = function(event) {
            let modal = document.getElementById('fileModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function filterCards(category) {
            if (category === 'all') {
                renderCards(allFiles);
            } else {
                let filtered = allFiles.filter(file => file.category === category);
                renderCards(filtered);
            }
        }
    </script>
</body>
</html>
